<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: user-deck-image:; connect-src 'self' ws: wss: user-deck-image:;">
    <title>Axes-Mundi - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #game-canvas {
            flex: 1;
            background: #2a2a2a;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }

        #ui-overlay > * {
            pointer-events: auto;
        }



        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #888;
        }

    </style>
</head>
<body>
    <div id="app">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-overlay">
            <div class="loading" id="loading">
                Loading Axes-Mundi...
            </div>
        </div>
    </div>

    <script>
        // Check if deck is selected
        const selectedDeck = localStorage.getItem('selectedDeck');
        if (!selectedDeck) {
            alert('No deck selected! Please go back and choose a deck.');
            window.location.href = './index.html';
        }
    </script>

    <script type="module" src="./main.ts"></script>
</body>
</html>
