<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:;">
    <title>Axes-Mundi - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #game-canvas {
            flex: 1;
            background: #2a2a2a;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }

        #ui-overlay > * {
            pointer-events: auto;
        }



        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #888;
        }

        .back-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .back-button:active {
            transform: scale(0.95);
        }

        .back-button svg {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-overlay">
            <div class="loading" id="loading">
                Loading Axes-Mundi...
            </div>
            
            <!-- Back to Deck Selection Button -->
            <button id="back-button" class="back-button" onclick="window.location.href='./index.html'" title="Back to Deck Selection">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = './index.html';
        }

        // Check if deck is selected
        const selectedDeck = localStorage.getItem('selectedDeck');
        if (!selectedDeck) {
            alert('No deck selected! Please go back and choose a deck.');
            window.location.href = './index.html';
        }
    </script>

    <script type="module" src="./main.ts"></script>
</body>
</html>
